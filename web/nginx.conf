server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  # Relative redirects keep the host and port the browser used (e.g. localhost:3000).
  absolute_redirect off;

  # The API accepts uploads up to 5 MB; leave headroom for multipart overhead.
  client_max_body_size 6m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build assets never change.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app (hash routing) lives under /app/.
  location = /app {
    return 301 /app/$is_args$args;
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;
    add_header Cache-Control "no-cache";
  }

  # The sign-in page.
  location = /login {
    return 301 /login/$is_args$args;
  }

  location /login/ {
    try_files $uri $uri/ /login/index.html;
    add_header Cache-Control "no-cache";
  }

  # The landing page at the root.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
