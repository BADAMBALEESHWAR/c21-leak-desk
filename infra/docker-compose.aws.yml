# Runs on the EC2 instance: api (image from ECR) + mongo. Secrets come from SSM via /opt/leakdesk/.env.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Memory caps so api + mongo + the OS fit the instance; user-data also adds 1 GB swap.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 400m
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    # A 1,00,000-order upload needs about 1 GB while it is analysed (t3.small has 2 GB plus swap).
    mem_limit: 1400m
    # .env: the v1 settings written by refresh.sh; .env.platform: v2 sign-in settings written by env-platform.sh
    # (optional, so an instance that has not been given them yet still starts).
    env_file:
      - path: /opt/leakdesk/.env
        required: true
      - path: /opt/leakdesk/.env.platform
        required: false
    environment:
      PORT: 8080
      NODE_OPTIONS: --max-old-space-size=1200
      # refresh.sh exports it; the S3 client and GET /health (region) read it.
      AWS_REGION: ${AWS_REGION}
    # Local fallback for uploads and large records if S3 is ever unreachable; kept across deploys.
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /leakdesk/api
        awslogs-create-group: "true"

volumes:
  mongo-data:
  uploads:
